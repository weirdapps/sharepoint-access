name: Monthly Dependency Refresh
'on':
  schedule:
    - cron: '7 6 14 * *'
  workflow_dispatch: {}
permissions:
  contents: write
  pull-requests: write
jobs:
  refresh:
    # Needs a PUSH_PAT repo secret. The reusable opens the PR with
    # `secrets.PUSH_PAT || github.token`, and this repo has "Allow GitHub
    # Actions to create and approve pull requests" off, so the GITHUB_TOKEN
    # fallback pushes the branch and then fails the job with "GitHub Actions is
    # not permitted to create or approve pull requests". See P10 in
    # "Issues - Pending Items.md".
    uses: weirdapps/shared-workflows/.github/workflows/deps-refresh.yml@738cb3809962f7a025db67266dad072166b7549b  # main
    with:
      node_version: '22'
      # Node 22 ships npm 10.9.4, whose Arborist crashes on this dependency
      # graph: `npm update` dies with "Cannot read properties of null (reading
      # 'edgesOut')" at #loadPeerSet (build-ideal-tree.js:1289). Reproduced on
      # the exact manifest: 10.9.4 crashes, 11.19.0 resolves 179 packages
      # clean. Same node (v22.23.2) passed on 2026-08-17, so it is the graph
      # that moved, not the runtime. Upgrade npm rather than node, so the gate
      # still runs on the version ci.yml and `engines` actually target.
      setup_cmd: npm install -g npm@11
      gate_cmd: npx tsc --noEmit && npm run build && npm test
    secrets: inherit
