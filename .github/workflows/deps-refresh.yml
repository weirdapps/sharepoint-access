name: Monthly Dependency Refresh
'on':
  schedule:
    - cron: '7 6 14 * *'
  workflow_dispatch: {}
permissions:
  contents: write
  pull-requests: write
jobs:
  refresh:
    # Needs a PUSH_PAT repo secret. The reusable opens the PR with
    # `secrets.PUSH_PAT || github.token`, and this repo has "Allow GitHub
    # Actions to create and approve pull requests" off, so the GITHUB_TOKEN
    # fallback pushes the branch and then fails the job with "GitHub Actions is
    # not permitted to create or approve pull requests". See P10 in
    # "Issues - Pending Items.md".
    uses: weirdapps/shared-workflows/.github/workflows/deps-refresh.yml@738cb3809962f7a025db67266dad072166b7549b  # main
    with:
      node_version: '22'
      gate_cmd: npx tsc --noEmit && npm run build && npm test
    secrets: inherit
