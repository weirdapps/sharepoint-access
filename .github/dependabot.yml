# Added 2026-08-25. Every third-party action in this repo is pinned by commit
# SHA, which is correct for supply-chain safety and means nothing updates on its
# own. Without the github-actions ecosystem below, a pin is not hardened, it is
# abandoned.
version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    ignore:
      # typescript 7 cannot be installed here. Every published
      # @typescript-eslint release (8.69.0 is latest) still declares
      # peerDependencies.typescript ">=4.8.4 <6.1.0", so npm has no resolvable
      # tree with typescript 7.x, and 7.1 exists only as an unreleased `next`
      # dev build. Pulling it into the dev-dependency group is what turned lint,
      # test and SonarCloud red on PR #4.
      # Scope is version-update only, so 6.x patch/minor bumps and any
      # typescript security advisory still come through.
      # REMOVE this entry as soon as @typescript-eslint ships a release whose
      # typescript peer range covers 7.x.
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
    groups:
      development-dependencies:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
      production-dependencies:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
