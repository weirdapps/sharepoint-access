# SonarCloud configuration for TypeScript/JavaScript projects

sonar.organization=weirdapps
sonar.projectKey=weirdapps_sharepoint-access
sonar.projectName=sharepoint-access

# Source code location
sonar.sources=.
sonar.sourceEncoding=UTF-8

# TypeScript/JavaScript settings
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclusions
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/.venv/**,\
  **/test_scripts/**,\
  **/*.test.ts,\
  **/*.test.js,\
  **/*.spec.ts,\
  **/*.spec.js

# Test exclusions
sonar.test.exclusions=\
  **/test_scripts/**,\
  **/*.test.ts,\
  **/*.test.js,\
  **/*.spec.ts,\
  **/*.spec.js
